server.port=8000
spring.jpa.hibernate.ddl-auto=create
spring.datasource.url=jdbc:h2:mem:aistyle
spring.datasource.driverClassName=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hugging Face API Configuration
huggingface.api-token=${HF_API_TOKEN:hf_test_token_placeholder}
huggingface.primary-model=mistralai/Mistral-7B-Instruct-v0.3
huggingface.fallback-model=google/gemma-2-2b-it
huggingface.api-url=http://localhost:3001/models/
