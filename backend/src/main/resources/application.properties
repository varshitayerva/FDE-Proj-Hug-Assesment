server.port=8000
spring.jpa.hibernate.ddl-auto=create
spring.datasource.url=jdbc:h2:mem:aistyle
spring.datasource.driverClassName=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hugging Face API Configuration
# IMPORTANT: API token should be set via environment variable HF_API_TOKEN
# DO NOT commit hardcoded API keys - use environment variables instead
# Using HuggingFace Inference API (supports any public model)
huggingface.api-token=${HF_API_TOKEN:}
huggingface.primary-model=${HF_PRIMARY_MODEL:google/flan-t5-base}
huggingface.fallback-model=${HF_FALLBACK_MODEL:facebook/opt-350m}
huggingface.api-url=${HF_API_URL:https://api-inference.huggingface.co/models/}
huggingface.judge-model=${HF_JUDGE_MODEL:google/flan-t5-base}
huggingface.quality-judge-model=${HF_QUALITY_JUDGE_MODEL:facebook/opt-350m}

# Logging for debugging
logging.level.com.aistyle.ai=DEBUG
logging.level.com.aistyle.workflow=DEBUG
logging.level.com.aistyle.tracing=DEBUG
logging.level.com.aistyle.config=DEBUG

# LangSmith Configuration
# IMPORTANT: API keys should be set via environment variables
# DO NOT commit hardcoded secrets to version control
langsmith.enabled=${LANGSMITH_ENABLED:true}
langsmith.api-key=${LANGSMITH_API_KEY:}
langsmith.endpoint=${LANGSMITH_ENDPOINT:https://api.smith.langchain.com}
langsmith.project=${LANGSMITH_PROJECT:StyleAI}
langsmith.tracing-enabled=${LANGSMITH_TRACING:true}
