server.port=8000
spring.jpa.hibernate.ddl-auto=create
spring.datasource.url=jdbc:h2:mem:aistyle
spring.datasource.driverClassName=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hugging Face API Configuration (Router endpoint with OpenAI compatibility)
# IMPORTANT: API token should be set via environment variable HF_API_TOKEN
# DO NOT hardcode sensitive API keys in this file
huggingface.api-token=${HF_API_TOKEN:}
huggingface.primary-model=deepseek-ai/DeepSeek-V4-Flash:novita
huggingface.fallback-model=meta-llama/Llama-2-7b-chat-hf
huggingface.api-url=https://router.huggingface.co/v1
huggingface.judge-model=deepseek-ai/DeepSeek-V4-Pro:novita
huggingface.quality-judge-model=meta-llama/Llama-2-7b-chat-hf

# Logging for debugging
logging.level.com.aistyle.ai=DEBUG
logging.level.com.aistyle.workflow=DEBUG
