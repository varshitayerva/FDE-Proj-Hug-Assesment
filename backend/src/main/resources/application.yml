spring:
  application:
    name: ai-stylist

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aistyle}
    username: ${DB_USERNAME:aistyle_user}
    password: ${DB_PASSWORD:aistyle_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  jackson:
    serialization:
      indent-output: true

jwt:
  secret: ${JWT_SECRET:your_super_secret_jwt_key_change_this_in_production}
  expiration: ${JWT_EXPIRATION:86400000}

huggingface:
  api-token: ${HF_API_TOKEN:}
  primary-model: mistralai/Mistral-7B-Instruct-v0.3
  fallback-model: google/gemma-2-2b-it
  api-url: https://api-inference.huggingface.co/models/

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.aistyle: DEBUG
